name: Alai Doc Publish

# Publishes the assets of the release ci.yml drafted for a tag.
on:
  release:
    types:
      - published

permissions: {}

jobs:
  publish:
    name: Publish to PyPI
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/alai-doc/${{ steps.download.outputs.version }}/
    permissions:
      contents: read  # Download the release assets
      attestations: read  # Verify the assets' build provenance
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download the sdist and wheels from the release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*.tar.gz' --pattern '*.whl' --dir dist --repo "$GITHUB_REPOSITORY"
          ls dist

          sdist=(dist/alai_doc-*.tar.gz)
          version="${sdist[0]#dist/alai_doc-}"
          echo "version=${version%.tar.gz}" >> "$GITHUB_OUTPUT"

      # Anyone with write access can add files to a release, so only publish what ci.yml built from this tag.
      - name: Verify the sdist and wheels were built by ci.yml from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/tags/$TAG" \
              --deny-self-hosted-runners
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
