[build-system]
requires = ["uv_build >= 0.9, < 0.14"]
build-backend = "uv_build"

[project]
name = "alai-doc"
version = "0.1.0"
description = "Ansible plugin documentation viewer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Borean" }]
requires-python = ">=3.10"
keywords = ["alai", "ansible", "collections", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]

dependencies = [
    # Run as a command (python -m alai), never imported. Its collection path and find output are the interface. A
    # commit of alai-cli's repository until it's on PyPI, given here rather than in [tool.uv.sources] so installs from
    # GitHub or the sdist find it too.
    "alai @ git+https://github.com/alai-sh/alai-cli@5a618e08518d911121143d82fd63bfd59da12216",
    # Whatever version alai pins, so docs are read with the alai-core alai uses.
    "alai-core",
    "textual >= 8.2",
]

[project.scripts]
alai-doc = "alai_doc._cli:main"

[project.urls]
Documentation = "https://alai.sh/alai-doc/"
Source = "https://github.com/alai-sh/alai-doc"
Issues = "https://github.com/alai-sh/alai-doc/issues"

[dependency-groups]
test = [
    "pytest >= 8",
    "pytest-xdist",
]
dev = [
    { include-group = "test" },
    "basedpyright >= 1.40.2",
    "coverage[toml] >= 5.3",  # Support for source_pkgs
    "ruff >= 0.17.0",
    "pre-commit",
    "tox-uv",
]
docs = [
    # The docs build runs on 3.15, as tox's docs env says. The marker lets uv still lock this group for 3.10.
    "cli-recorder ; python_version >= '3.15'",
    "zensical >= 0.0.71; python_version >= '3.15'",
]

[tool.cli-recorder]
# The docs' terminal recordings and CLI reference, see docs/recordings.toml.
program = "alai-doc"
parser = "alai_doc._cli:_parser"
fixture = "docs/recordings.py"
header = """\
---
description: alai-doc's command line and the options it takes.
---

<!-- Written by python -m cli_recorder reference from alai-doc's argument parser. Edit the help there, not here. -->

# CLI reference

alai-doc's command line, with what it does and the options it takes, as
`alai-doc --help` shows them. The recordings were made when these docs were
built, so their output is alai-doc's own, though the collections are only
examples.
"""

[tool.uv]
# Reinstall on any source change, not only on pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
]

[tool.uv.sources]
# uv.lock pins it to a commit, and uv lock --upgrade-package cli-recorder moves it.
cli-recorder = { git = "https://github.com/alai-sh/cli-recorder" }

[tool.basedpyright]
include = ["src", "tests", "docs"]
pythonVersion = "3.10"
reportAny = false
# typing.override needs 3.12.
reportImplicitOverride = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
# A call's unused result needs no _ = to say so.
reportUnusedCallResult = false

executionEnvironments = [
    # pytest fixtures are parameters a test may not use.
    { root = "tests", reportUntypedFunctionDecorator = false, reportUnusedParameter = false },
    # The recordings' fixture imports the tests' helpers, adding tests/ to sys.path itself.
    { root = "docs", extraPaths = ["tests"] },
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "PERF",
    "PIE",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

ignore = [
    # Conflicts with basedpyright's reportImplicitStringConcatenation.
    "ISC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF012"]
# pathlib's import cost would land on every run.
"src/**" = ["PTH"]
# alai runs from alai-doc's own environment, as python -m alai, with its arguments as a list.
"src/alai_doc/_alai.py" = ["S603"]
"src/alai_doc/_output.py" = ["T201"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["typing", "collections.abc"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"typing" = "_t"
"collections.abc" = "_c"

[tool.ruff.lint.isort]
known-first-party = ["alai_doc"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = "tests"
junit_family = "xunit2"

[tool.coverage.paths]
source = ["src", ".tox/py*/**/site-packages"]

[tool.coverage.run]
branch = true
# The tests run from another directory.
data_file = "${PROJECT_ROOT}/.coverage"
disable_warnings = ["module-not-imported", "no-data-collected"]
source_pkgs = ["alai_doc"]
parallel = true

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    sanity
    py3{10,11,12,13,14,15}-tests
    py3{14,15}t-tests
min_version = 4.0

[testenv]
package = wheel
wheel_build_env = .pkg
runner = uv-venv-lock-runner

passenv =
    PYTEST_ADDOPTS

set_env =
    tests: COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
    tests: PROJECT_ROOT={toxinidir}

commands_pre =
    # Not {env_site_packages_dir}, which misses the "t" in a free-threaded build's lib/python3.14t.
    tests: python -c 'import pathlib, sysconfig; pathlib.Path(sysconfig.get_path("purelib"), "cov.pth").write_text("import coverage; coverage.process_startup()")'

commands =
    sanity: python -m ruff check .
    sanity: python -m ruff format . --check
    sanity: python -m basedpyright --warnings
    tests: python -m coverage run -m pytest -v {posargs:-n auto}

commands_post =
    tests: python -m coverage combine --quiet
    tests: python -m coverage report
    tests: python -m coverage xml

[testenv:sanity]
base_python = py315

[testenv:docs]
# Checks the CLI reference matches the parser and records the terminal recordings, builds the docs strictly, then
# checks every link between them, anchors included, which the build doesn't.
base_python = py315
dependency_groups = docs
commands =
    python -m cli_recorder assets docs/assets/cli-recorder
    python -m cli_recorder reference --check
    python -m cli_recorder record
    zensical build --strict
    python -m cli_recorder check-links
"""
